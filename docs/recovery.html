<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bulletin Connection Recovery</title>
<style>
body { max-width: 540px; margin: 8vh auto; padding: 24px; font: 16.5px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #F6F1E8; color: #1E1F4B; }
button, a { padding: 12px 18px; background: #1E1F4B; color: #fff; border: 0; border-radius: 10px; font: inherit; font-weight: 700; text-decoration: none; display: inline-block; cursor: pointer; }
</style>
</head>
<body>
<h1>Refreshing Digital Bulletin</h1>
<p id="status" role="status">Updating cached files to fetch the latest Sunday bulletin. Please wait a moment...</p>
<p style="font-size:14px; color:#4A4E69;">Your personal saved prayers, notes, and check-ins on this phone will be preserved.</p>
<button id="retry" hidden>Try Again</button>
<a id="open" hidden href="./">Open Bulletin</a>
<script>
(function(){
  const label = document.getElementById('status'), retry = document.getElementById('retry');
  function build(worker){
    return new Promise(resolve => {
      if(!worker){ resolve(''); return; }
      const channel = new MessageChannel();
      const timer = setTimeout(() => resolve(''), 1500);
      channel.port1.onmessage = e => { clearTimeout(timer); resolve((e.data && e.data.build) || ''); channel.port1.close(); };
      worker.postMessage({ type: 'GET_BULLETIN_BUILD' }, [channel.port2]);
    });
  }
  async function recover(){
    retry.hidden = true;
    label.textContent = 'Updating cached files... Please wait a moment.';
    try {
      if(!('serviceWorker' in navigator)) throw new Error('Automatic cache recovery is not supported in this browser.');
      const r = await navigator.serviceWorker.register('./sw.js', { scope: './', updateViaCache: 'none' });
      await r.update();
      const start = Date.now();
      while(Date.now() - start < 25000){
        if(r.waiting) r.waiting.postMessage({ type: 'SKIP_WAITING' });
        if(await build(r.active) === '20261123-cumc-1'){
          label.textContent = 'Updated! Opening the latest bulletin...';
          document.getElementById('open').hidden = false;
          location.replace('./?pwa_recovery=1');
          return;
        }
        await new Promise(resolve => setTimeout(resolve, 500));
      }
      throw new Error('Could not reach the latest bulletin server. Please check your internet connection.');
    } catch(e) {
      label.textContent = e.message || 'Recovery failed. Please tap Try Again.';
      retry.hidden = false;
    }
  }
  retry.onclick = recover;
  recover();
})();
</script>
</body>
</html>
